name: shell_app
description: Aplicación principal que ensambla el monorepo SaaS System Guri.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^2.6.0
  go_router: ^14.0.0
  supabase_flutter: ^2.12.0
  core_network:
    path: ../../core/core_network
  core_auth:
    path: ../../core/core_auth
  core_ui:
    path: ../../core/core_ui
  core_utils:
    path: ../../core/core_utils
  feature_auth:
    path: ../../features/feature_auth
  feature_admin:
    path: ../../features/feature_admin
  feature_menu_qr:
    path: ../../features/feature_menu_qr
  feature_pos:
    path: ../../features/feature_pos
  feature_cocina:
    path: ../../features/feature_cocina
  feature_billing:
    path: ../../features/feature_billing

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
